name = "proofship-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Deploy uses ambient Wrangler authentication; do not commit account_id here.

[durable_objects]
bindings = [
  { name = "SESSION_ROOM", class_name = "SessionRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[[d1_databases]]
binding = "DB"
database_name = "proofship-accounts"
database_id = "372a7f2b-d5ab-43ee-8b15-97ba6576eaef"

[vars]
SIWE_DOMAIN = "proofship-web.pages.dev"
SIWE_URI = "https://proofship-web.pages.dev/"
