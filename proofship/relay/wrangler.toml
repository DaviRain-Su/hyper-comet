name = "proofship-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Deploy uses ambient Wrangler authentication; do not commit account_id here.

[durable_objects]
bindings = [
  { name = "SESSION_ROOM", class_name = "SessionRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

# Optional accounts DB (Phase 4.2). When unset, relay uses an in-memory store
# (local spike / tests). Create + bind before production:
#   wrangler d1 create proofship-accounts
#   wrangler d1 execute proofship-accounts --file=schema.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "proofship-accounts"
# database_id = "<set-after-create>"
